services:
  db:
    image: postgres:17-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
  backend:
    build: ./server
    container_name: fastapi_backend
    environment:
      DB_HOST: db
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_NAME: mydb
    ports:
      - "8000:8000"
    depends_on:
      - db
  frontend:
    build: ./client
    container_name: react_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  postgres_data: